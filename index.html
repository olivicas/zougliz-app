<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181638"><meta name="description" content="Zougliz, des mini-jeux pour toute la famille."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Zougliz · Mini-jeux</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#11102a}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:960px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}header strong{font-size:1.6rem;color:#ffe07b}.pill{border-radius:30px;background:#28264e;padding:9px 15px;color:#ded9ff;text-decoration:none}.hero{padding:35px 24px;border-radius:26px;background:linear-gradient(125deg,#6944dd,#db548c);margin:8px 0 28px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 12px}.hero p{line-height:1.5;max-width:520px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.game{background:#242344;border:1px solid #403c67;border-radius:20px;padding:22px}.game .emoji{font-size:2.8rem}.game h3{margin:12px 0 8px}.game p{color:#c9c5e1;min-height:48px}.game a,.primary{display:inline-block;border:0;border-radius:12px;padding:12px 17px;background:#ffdc71;color:#252039;font-weight:750;text-decoration:none;cursor:pointer}h2{margin-top:30px}footer{color:#b7b2d2;font-size:.9rem}#install{display:none}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><header><strong>🎮 ZOUGLIZ</strong><a class="pill" href="https://zougliz.wordpress.com/" target="_blank" rel="noopener">Site original</a></header><main><section class="hero"><h1>À toi de jouer !</h1><p>Des aventures, des défis et des jeux amusants à découvrir. Bienvenue dans l'univers Zougliz !</p><button id="install" class="primary">Installer Zougliz</button></section><h2>Les jeux</h2><div class="grid" id="games"></div></main><footer>Zougliz · Une application de mini-jeux. Certains jeux nécessitent Internet.</footer><script>const games=[["🧩","Puzzle","Assemble les pièces pour retrouver l'image."],["🚀","Space Invaders","Défends la galaxie."],["🧱","Tetris","Empile les blocs et marque des points."],["🏎️","Néon Racer","Un défi de course arcade."],["⭐","Les étoiles","Une aventure pleine d'étoiles."],["🐾","Le jardin des animaux","Découvre un univers animalier."],["🗺️","La chasse aux trésors","Pars à la recherche des trésors."],["🧠","Quiz","Teste tes connaissances."],["🌌","Astro","Une aventure dans l'espace."]];document.querySelector("#games").innerHTML=games.map(([emoji,name,desc])=>'<article class="game"><div class="emoji" aria-hidden="true">'+emoji+'</div><h3>'+name+'</h3><p>'+desc+'</p><a href="https://zougliz.wordpress.com/?s='+encodeURIComponent(name)+'" target="_blank" rel="noopener" aria-label="Rechercher '+name+' sur Zougliz">Trouver le jeu ↗</a></article>').join("");if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.querySelector("#install").style.display="inline-block"});document.querySelector("#install").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.querySelector("#install").style.display="none"};</script></body></html>
