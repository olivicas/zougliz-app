<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17132d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Zougliz — À toi de jouer</title><style>*{box-sizing:border-box}body{margin:0;background:#17132d;color:#fff;font:16px system-ui,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}header strong{font-size:1.6rem;color:#ffe078}button,a{font:inherit;cursor:pointer}button{border:0}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.hero{background:linear-gradient(120deg,#6944dd,#ac367e);padding:26px;border-radius:24px;position:relative;overflow:hidden}.hero h1{font-size:clamp(2rem,6vw,3.5rem);margin:5px 0}.hero p{margin:8px 0 18px}.primary{background:#ffe078;color:#201731;font-weight:800;border-radius:12px;padding:12px 16px;text-decoration:none;display:inline-block}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button,.secondary{background:#30294c;color:#fff;padding:10px 15px;border-radius:22px;white-space:nowrap}.tabs button[aria-pressed=true]{background:#ffe078;color:#211832;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.game{border-radius:18px;background:#28213f;overflow:hidden;display:flex;flex-direction:column}.cover{aspect-ratio:16/10;display:grid;place-items:center;background:linear-gradient(130deg,#4c3e92,#ae4b84);font-size:3rem;position:relative}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.info{padding:12px;display:flex;flex-direction:column;flex:1}.info h3{font-size:1rem;margin:5px 0}.info p{font-size:.85rem;color:#d5cde8;line-height:1.4;flex:1}.cat{font-size:.72rem;color:#e1caff}.actions{display:flex;gap:7px;align-items:center}.actions .primary{flex:1;text-align:center;padding:10px 5px}.fav{background:#44375e;color:#ffe078;border-radius:10px;width:40px;height:42px;font-size:1.3rem}.search{width:100%;border:1px solid #514568;border-radius:12px;background:#28213f;color:white;padding:12px;font:inherit}footer{color:#c5b9df;font-size:.85rem}#player{position:fixed;inset:0;background:#17132d;z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#player[hidden]{display:none}#bar{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}#bar strong{flex:1}iframe{width:100%;flex:1;border:0;background:white}#install[hidden]{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><strong>🎮 ZOUGLIZ</strong><button class="secondary" id="install" hidden>Installer</button></header><main><section class="hero"><small id="gameTotal">9 JEUX • GRATUITS</small><h1>À toi de jouer !</h1><p>Des aventures, des défis et des découvertes pour toute la famille.</p><button class="primary" id="random">🎲 Jeu surprise</button></section><h2>Choisis ton jeu</h2><input class="search" id="search" type="search" placeholder="Rechercher un jeu" aria-label="Rechercher un jeu"><nav class="tabs" aria-label="Catégories"></nav><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><p id="count" aria-live="polite"></p><button class="secondary" id="refreshCatalog">↻ Actualiser</button></div><p id="syncStatus" role="status" style="font-size:.8rem;color:#c5b9df"></p><div class="grid" id="games"></div></main><footer>Les jeux nécessitent Internet. <a style="color:inherit" href="https://zougliz.wordpress.com/">Site original Zougliz</a></footer><section id="player" hidden aria-label="Jeu"><div id="bar"><button class="secondary" id="back">← Retour</button><strong id="playing"></strong><a class="primary" id="external" target="_blank" rel="noopener">Ouvrir ↗</a></div><iframe id="frame" title="Jeu Zougliz" allow="fullscreen; autoplay" allowfullscreen></iframe></section><script>const excludedGames=new Set([222,380,379,384,429]);let games=[{"id":385,"title":"Les étoiles","cat":"Aventures","desc":"Explore un univers étoilé et mystérieux.","url":"https://snazzy-churros-070d76.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/1000012749.jpg?w=650","emoji":"⭐"},{"id":383,"title":"La clinique des animaux","cat":"Aventures","desc":"Deviens vétérinaire et soigne les petits animaux.","url":"https://whimsical-panda-4ba49b.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/vete.png?w=650","emoji":"🐶"},{"id":382,"title":"Puzzle","cat":"Réflexion","desc":"Assemble les pièces et reconstitue l’image.","url":"https://merry-melba-8dd14e.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/1000012750.jpg?w=650","emoji":"🧩"},{"id":381,"title":"Space Invaders","cat":"Arcade","desc":"Défends la galaxie face aux envahisseurs.","url":"https://frolicking-belekoy-1f67d4.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/mastertux-background-3311042.jpg?w=650","emoji":"👾"},{"id":378,"title":"Le mémo des animaux","cat":"Réflexion","desc":"Retrouve les six paires d’animaux.","url":"https://sprightly-croissant-6cda89.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/ylanite_nietjuhart-background-10159933.jpg?w=650","emoji":"🐱"},{"id":74,"title":"Mini Tetris","cat":"Réflexion","desc":"Aligne les pièces et bats ton meilleur score.","url":"https://glowing-kangaroo-393bac.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/rer.png?w=650","emoji":"🧱"},{"id":69,"title":"Astro","cat":"Arcade","desc":"Pars dans l’espace et relève le défi intergalactique.","url":"https://fastidious-peony-7376c9.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/castr.png?w=650","emoji":"🚀"},{"id":60,"title":"Quizz","cat":"Réflexion","desc":"Teste tes connaissances et enchaîne les bonnes réponses.","url":"https://minikidsgame.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/capture-decran-2026-11-11-145534.png?w=650","emoji":"💡"},{"id":43,"title":"Le jardin des animaux","cat":"Réflexion","desc":"Ouvre l’œil et retrouve le bon animal.","url":"https://harmonious-basbousa-901304.netlify.app","img":"https://zougliz.wordpress.com/wp-content/uploads/2026/11/mollyroselee-beagle-9709437.jpg?w=650","emoji":"🐾"}];let favs=[];try{favs=JSON.parse(localStorage.getItem("zougliz-favs")||"[]")}catch{}let filter="Tous";const $=id=>document.getElementById(id);const categories=["Tous","Arcade","Aventures","Réflexion","Favoris"];function render(){document.querySelector(".tabs").replaceChildren(...categories.map(c=>{const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",String(c===filter));b.onclick=()=>{filter=c;render()};return b}));const q=$("search").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const visible=games.filter(g=>(filter==="Tous"||filter===g.cat||filter==="Favoris"&&favs.includes(g.id))&&g.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q));$("count").textContent=visible.length+" jeu(x)";$("games").replaceChildren(...visible.map(g=>{const a=document.createElement("article");a.className="game";const cover=document.createElement("div");cover.className="cover";cover.textContent=g.emoji;if(g.img){const img=document.createElement("img");img.src=g.img;img.alt="";img.loading="lazy";img.onerror=()=>img.remove();cover.append(img)}const info=document.createElement("div");info.className="info";const cat=document.createElement("span");cat.className="cat";cat.textContent=g.cat;const h=document.createElement("h3");h.textContent=g.title;const p=document.createElement("p");p.textContent=g.desc;const actions=document.createElement("div");actions.className="actions";const play=document.createElement("button");play.className="primary";play.textContent="▶ Jouer";play.onclick=()=>openGame(g);const f=document.createElement("button");f.className="fav";f.textContent=favs.includes(g.id)?"★":"☆";f.setAttribute("aria-label","Favori : "+g.title);f.setAttribute("aria-pressed",String(favs.includes(g.id)));f.onclick=()=>{favs=favs.includes(g.id)?favs.filter(x=>x!==g.id):[...favs,g.id];try{localStorage.setItem("zougliz-favs",JSON.stringify(favs))}catch{}render()};actions.append(play,f);info.append(cat,h,p,actions);a.append(cover,info);return a}))}function openGame(g){$("playing").textContent=g.title;$("external").href=g.url;$("frame").src=g.url;$("player").hidden=false;document.body.style.overflow="hidden";history.pushState({game:g.id},"","#jeu-"+g.id);$("back").focus()}function closeGame(){$("player").hidden=true;$("frame").src="about:blank";document.body.style.overflow=""}$("back").onclick=()=>{closeGame();if(history.state?.game)history.back()};window.addEventListener("popstate",()=>{const g=games.find(x=>x.id===history.state?.game);if(g){$("playing").textContent=g.title;$("external").href=g.url;$("frame").src=g.url;$("player").hidden=false;document.body.style.overflow="hidden"}else closeGame()});$("search").oninput=render;$("random").onclick=()=>openGame(games[Math.floor(Math.random()*games.length)]);render();let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").hidden=false});$("install").onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$("install").hidden=true}};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
let syncing=false,lastSync=0;
const syncKey="zougliz-catalog-v3";
function applyCatalog(items){games=items.filter(g=>!excludedGames.has(g.id));$("gameTotal").textContent=games.length+" JEUX • GRATUITS";render()}
try{const saved=JSON.parse(localStorage.getItem(syncKey)||"null");if(Array.isArray(saved)&&saved.length&&saved.every(g=>Number.isInteger(g.id)&&typeof g.title==="string"&&/^https:\/\/[a-z0-9-]+\.netlify\.app(?:\/|$)/i.test(g.url)))applyCatalog(saved)}catch{}
function plain(s){const t=document.createElement("textarea");t.innerHTML=String(s||"").replace(/<[^>]*>/g,"");return t.value.trim()}
function safeUrl(s,kind){try{const u=new URL(s);if(u.protocol!=="https:"||u.username||u.password)return "";if(kind==="game"&&!/^[a-z0-9-]+\.netlify\.app$/i.test(u.hostname))return "";if(kind==="image"&&!(u.hostname==="zougliz.wordpress.com"||u.hostname==="zougliz.files.wordpress.com"||/^i[0-9]+\.wp\.com$/.test(u.hostname)))return "";return u.href}catch{return ""}}
async function syncCatalog(force=false){if(syncing||(!force&&Date.now()-lastSync<60000))return;syncing=true;$("syncStatus").textContent="Actualisation du catalogue…";try{const all=[];let page=1;while(true){const u="https://public-api.wordpress.com/wp/v2/sites/zougliz.wordpress.com/posts?per_page=100&page="+page+"&_fields=id,title,excerpt,content,categories,link";const r=await fetch(u,{cache:"no-store",signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error("WordPress "+r.status);const rows=await r.json();if(!Array.isArray(rows))throw Error("Format inattendu");all.push(...rows);const total=Number(r.headers.get("X-WP-TotalPages"));if(rows.length<100||(total>0&&page>=total))break;if(++page>100)throw Error("Catalogue trop grand")}
const map={33996:"Arcade",14226:"Aventures",13645:"Réflexion"};const next=[];for(const p of all){if(excludedGames.has(p.id))continue;const cat=(p.categories||[]).map(id=>map[id]).find(Boolean);if(!cat)continue;const html=p.content?.rendered||"";const doc=new DOMParser().parseFromString(html,"text/html");const url=Array.from(doc.querySelectorAll("a[href]")).map(a=>safeUrl(a.getAttribute("href"),"game")).find(Boolean);if(!url)continue;const old=games.find(g=>g.id===p.id);const img=Array.from(doc.querySelectorAll("img[src]")).map(i=>safeUrl(i.getAttribute("src"),"image")).find(Boolean)||"";next.push({id:p.id,title:plain(p.title?.rendered),desc:plain(p.excerpt?.rendered),cat,url,img,emoji:old?.emoji||({Arcade:"🎮",Aventures:"🗺️",Réflexion:"🧩"})[cat]})}if(!next.length)throw Error("Aucun jeu reconnu");applyCatalog(next);try{localStorage.setItem(syncKey,JSON.stringify(next))}catch{}lastSync=Date.now();$("syncStatus").textContent="Catalogue synchronisé · "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){$("syncStatus").textContent="Catalogue enregistré · actualisation indisponible"}finally{syncing=false}}
$("refreshCatalog").onclick=()=>syncCatalog(true);syncCatalog(true);window.addEventListener("online",()=>syncCatalog(true));document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncCatalog()});setInterval(()=>{if(!document.hidden)syncCatalog()},300000);
</script></body></html>
